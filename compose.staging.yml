# Supabase user JWTs protect APIs; deployment validates Auth configuration at startup.
name: careeros-backend-staging
services:
  backend:
    build:
      context: .
    image: careeros-backend:staging-${IMAGE_TAG:-local}
    init: true
    restart: on-failure:3
    env_file:
      - path: ${APP_ENV_FILE:-.env.staging}
        format: raw
    environment:
      APP_ENV: staging
      ALLOW_LOCAL_IDENTITY: "false"
      DOCUMENT_STORAGE_DIR: /data/careeros/documents
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8002:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - documents:/data/careeros/documents
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=5)); assert r['database']=='ok'"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  documents:
